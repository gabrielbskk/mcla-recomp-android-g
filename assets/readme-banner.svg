<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">MCLA Recomp for Android ARM64</title>
  <desc id="desc">A custom midnight-blue city skyline with the project title and experimental Android ARM64 label.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102d49"/>
      <stop offset="1" stop-color="#165b73"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#25d0c2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#79f2cf" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="windows" width="34" height="30" patternUnits="userSpaceOnUse">
